<style>

.wa{color:#ffa94d}.ex{border-bottom:1px solid var(--ln);padding:6px 0}.pd{opacity:.55}.cb{display:flex;align-items:center;gap:6px;white-space:nowrap}input[type=checkbox]{width:22px;height:22px;padding:0}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 78px 98px 22px 24px;gap:4px;align-items:center;padding:4px 0}.ex input:not([type=checkbox]),.ex select{padding:8px 4px}.ex button{border:0;background:none;color:var(--ac);font:inherit;padding:0}.eh{font-size:12px;color:var(--mu)}.tq{color:#2dd4cf}

</style></head><body><main>
<h1>Finanzstatus</h1><div id="st" class="mu" style="font-size:13px;margin:-2px 0 8px">Verbinde …</div><div style="font-size:12px;margin:-4px 0 8px" class="mu"><a href="#" id="pw" style="color:inherit">Passwort ändern</a> · <a href="#" id="lo" style="color:inherit">Abmelden</a></div><div id="bn"></div><nav id="n"></nav><div id="v"></div><div id="lg" hidden style="position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px"><form id="lf" style="width:100%;max-width:340px;display:grid;gap:12px"><div style="font-size:44px;text-align:center">💶</div><h1 style="text-align:center;margin:0">Finanzstatus</h1><input id="le" type="email" autocomplete="username" placeholder="E-Mail" required style="font:16px inherit;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)"><input id="lp" type="password" autocomplete="current-password" placeholder="Passwort" required style="font:16px inherit;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)"><button class="pri" type="submit" style="padding:12px;font-size:16px">Anmelden</button><div id="lm" class="mu" style="text-align:center;font-size:13px;min-height:18px"></div></form></div>

<p class="mu" style="font-size:13px">Änderungen werden online gespeichert und auf allen Geräten übernommen. <button class="lnk" onclick="rs()">Zurücksetzen</button> <button class="lnk" onclick="ex()">Daten exportieren</button></p>
</main>
<script>
const MN=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const AC=["Manuel Comdirect","Sandra ING Diba","Sandra Comdirect","ETF Sparer","Aktien","XRP"];
const DEF=(()=>{const e=()=>({n:'',g:[],f:[],v:[],s:[]});return{cur:0,tab:'m',giro:[0,0],inc:[0,0,0,0,0,0],base:{M:Object.assign(e(),{n:'Manuel'}),S:Object.assign(e(),{n:'Sandra'})},a:Array.from({length:60},()=>[0,0,0,0,0,0]),m:Array.from({length:60},(_,k)=>({s:k?null:0,i:[],e:[]})),rb:{g:1500,a:650},rbv:1,ac:{},y0:2023}})();
const HAD=(()=>{try{return localStorage.getItem('fin26')!==null}catch(e){return false}})();let DY=(()=>{try{const d=localStorage.getItem('fin26d');return d===null?HAD:d==='1'}catch(e){return false}})();
let S;try{S=JSON.parse(localStorage.getItem('fin26'))}catch(e){}
if(!S||!S.m)S=JSON.parse(JSON.stringify(DEF));
if(!S.inc)S.inc=[100,150,0,650,0,0];
var M27=[];
var Y0=2023;var HIST=[];var HA=[];
var JE=false;var MIG;function cmo(){const d=new Date();return (d.getFullYear()-Y0)*12+d.getMonth()}
function migY(o){if(o.y0)return o;o.m=JSON.parse(JSON.stringify(HIST)).concat(o.m);o.a=JSON.parse(JSON.stringify(HA)).concat(o.a);const ac={};Object.keys(o.ac||{}).forEach(q=>{const t=q.split('-');ac[(+t[0]+36)+'-'+t[1]]=o.ac[q]});o.ac=ac;o.y0=Y0;MIG=true;return o}
const mj=j=>JSON.stringify(migY(JSON.parse(j)));
function nz(){migY(S);if(!S.gd)S.gd=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);if(!S.ac)S.ac={};Object.keys(S.ac).forEach(q=>{if(+q.split('-')[1]>=4&&!/^\d{4}-\d\d-\d\d$/.test(S.ac[q]))delete S.ac[q]});if(!S.rb)S.rb={g:1500,a:650};S.m.forEach((m,k)=>{m.e.forEach(x=>{if(x[2]===undefined){x[2]='b';x[3]=k<9?1:0}});m.e.sort((a,b)=>(a[3]?1:0)-(b[3]?1:0))});if(!S.rbv){S.rbv=1;MIG=true;const cm=cmo();S.m.forEach((m,k)=>{if(k>cm){const e=m.i.find(x=>x[0]=='Manuel'&&x[2]!='r');if(e)e[1]=S.rb.g;else m.i.unshift(['Manuel',S.rb.g])}})}while(S.m.length<60){const mm=JSON.parse(JSON.stringify(M27[S.m.length-48]));mm.i.forEach(x=>{if(x[0]=='Manuel')x[1]=S.rb.g});S.m.push(mm);MIG=true}while(S.a.length<60){const p=S.a[S.a.length-1];S.a.push(p.map((v,i)=>v+(S.inc[i]||0)))}}nz();
S.cur=Math.max(0,Math.min(S.m.length-1,cmo()));delete S.yr;
const $=s=>document.querySelector(s),sl=()=>{try{localStorage.setItem('fin26',JSON.stringify(S))}catch(e){}},sv=()=>{sl();dirty(1);sched()};
const fm=n=>(+n).toLocaleString('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(+n)?0:2,maximumFractionDigits:2});
const sm=l=>l.reduce((t,x)=>t+(+x[1]||0),0),es=s=>String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'),cl=n=>n<0?'no':'ok';
function calc(){let c=0;return S.m.map((m,k)=>{const st=m.s!=null&&m.s!==''?+m.s:c,ei=sm(m.i),au=sm(m.e),rest=st+ei-au,a=S.a[k],sp=a[0]+a[1]+a[2]+a[3],bo=a[4]+a[5],o={st,ei,au,rest,uc:c,sp,bo,ges:rest+sp+bo};c=rest;return o})}
function bs(p){const b=S.base[p],g=sm(b.g),f=sm(b.f),v=sm(b.v),s=sm(b.s);return{g,f,v,s,ue:g-f-v,mu:g-f-v-s}}
function mlab(k){return MN[k%12]+' '+(Y0+Math.floor(k/12))}
function YR(){return S.yr!=null?S.yr:Math.floor(S.cur/12)}
function ysel(){const y=YR();return `<div class=ys style='display:flex;gap:6px'>`+[0,1,2,3,4].map(i=>`<button class='yb${i==y?' on':''}' onclick='yb(${i})'>${Y0+i}</button>`).join('')+`</div>`}
function vU(){const ra=calc(),y=YR(),r=ra.slice(y*12,y*12+12),T=r.reduce((t,x)=>[t[0]+x.ei,t[1]+x.au],[0,0]),e=r[11];
return ysel()+`<div class=card><b>Verfügbar auf dem Girokonto</b> <span class=mu>(Basis)</span><div class=r2><span>Manu</span><input type=number value="${S.giro[0]}" onchange="gi(0,this.value)"></div><div class=r2><span>Sandra</span><input type=number value="${S.giro[1]}" onchange="gi(1,this.value)"></div><div class=sum><span>Gesamt</span><b>${fm(S.giro[0]+S.giro[1])}</b></div></div>
<div class=card><div class=k><div><small>Ende ${mlab(S.cur)} flüssig</small><b class="${cl(ra[S.cur].rest)}">${fm(ra[S.cur].rest)}</b></div><div><small>Alles zusammen (Ende ${Y0+y})</small><b>${fm(e.ges)}</b></div><div><small>Einnahmen ${Y0+y}</small><b>${fm(T[0])}</b></div><div><small>Ausgaben ${Y0+y}</small><b>${fm(T[1])}</b></div></div></div>
<div class="card sc"><table><tr><th>Monat<th>Start<th>Einnahmen<th>Ausgaben<th>Rest<th>Sparer<th>Börse<th>Gesamt</tr>`+r.map((x,i)=>{const k=y*12+i;return `<tr class="c${k==S.cur?' cur':''}" onclick="go('m',${k})"><td>${MN[i]}<td>${fm(x.st)}<td>${fm(x.ei)}<td>${fm(x.au)}<td class="${cl(x.rest)}">${fm(x.rest)}<td>${fm(x.sp)}<td>${fm(x.bo)}<td>${fm(x.ges)}</tr>`}).join('')+`</table></div>`}
function rbrow(k){const h=S.m[k].i.some(x=>x[2]=='r');return `<label class=cb style='margin:2px 0 8px'><input type=checkbox ${h?'checked':''} onchange="rbt(${k},this.checked)"> Rufbereitschaft (+${fm(S.rb.a)})</label>`}
function ls(t,k,l){return l.map((x,j)=>x[2]=='r'?`<div class=r><input value="${es(x[0])}" readonly><input value="${x[1]}" readonly><span></span></div>`:`<div class=r><input value="${es(x[0])}" onchange="ed('${t}',${k},${j},0,this.value)"><input type=number step=any inputmode=decimal value="${x[1]}" oninput="lv('${t}',${k},${j},this.value)" onchange="ed('${t}',${k},${j},1,this.value)"><button onclick="rm('${t}',${k},${j})">×</button></div>`).join('')+`<button class=add onclick="ad('${t}',${k})">+ Eintrag</button>`}
function ac(k,f,t){return AC.slice(f,t).map((n,i)=>{const j=f+i,c=(S.ac||{})[k+'-'+j]||'';return `<div class="r2 r2c"><span>${n}</span>${j>=4?`<div><small class=mu style='display:block;font-size:11px'>zuletzt geprüft</small><input type=date class=cm value="${c}" onchange="sgd(${k},${j},this.value)"></div>`:`<input class=cm placeholder="Kommentar" value="${es(c)}" onchange="sac(${k},${j},this.value)">`}<input type=number class="${c&&j<4?'pk':''}" value="${S.a[k][j]}" onchange="sa(${k},${j},this.value)"></div>`}).join('')}
function sgd(k,j,v){if(!S.ac)S.ac={};for(let m=k;m<S.a.length;m++){const key=m+'-'+j;if(v)S.ac[key]=v;else delete S.ac[key]}sv();R()}
function sac(k,j,v){if(!S.ac)S.ac={};const key=k+'-'+j;if(v.trim())S.ac[key]=v.trim();else delete S.ac[key];sv();R()}
function gk(){return`<div class=card><b>Verfügbar auf dem Girokonto</b><div class=r2><span>Manu</span><input type=number value="${S.giro[0]}" onchange="gi(0,this.value)"></div><div class=r2><span>Sandra</span><input type=number value="${S.giro[1]}" onchange="gi(1,this.value)"></div><div class=sum><span>Gesamt</span><b id=ggs>${fm(S.giro[0]+S.giro[1])}</b></div><div id=gko>${gkh(S.cur)}</div></div>`}
function gpt(k){const g=S.giro[0]+S.giro[1];let o=0;S.m[k].e.forEach(x=>{if(!x[3])o+=+x[1]||0});const d=g-o-calc()[k].rest;return`Gap ${d>0?'+':''}${fm(d)}`}
function lx(k,l){return`<div class="ex eh"><span>Text</span><span>Betrag</span><span>Status</span><span>✓</span><span></span></div>`+l.map((x,j)=>`<div class="ex${x[3]?' pd':''}"><input value="${es(x[0])}" onchange="ed('e',${k},${j},0,this.value)"><input class="${x[2]=='g'?'wa':'ok'}" type=number step=any inputmode=decimal value="${x[1]}" oninput="lv('e',${k},${j},this.value)" onchange="ed('e',${k},${j},1,this.value)"><select onchange="sx(${k},${j},2,this.value)"><option value=b ${x[2]=='g'?'':'selected'}>bekannt</option><option value=g ${x[2]=='g'?'selected':''}>geschätzt</option></select><input type=checkbox ${x[3]?'checked':''} onchange="sx(${k},${j},3,this.checked?1:0)"><button onclick="rm('e',${k},${j})">×</button></div>`).join('')+`<button class=add onclick="ad('e',${k})">+ Eintrag</button>`}
function gkh(k){const g=S.giro[0]+S.giro[1];let ob=0,og=0;S.m[k].e.forEach(x=>{if(!x[3]){const v=+x[1]||0;if(x[2]=='g')og+=v;else ob+=v}});return`<div class=sum><span>Offen bekannt</span><b class=ok>${fm(ob)}</b></div><div class=sum><span>Offen geschätzt</span><b class=wa>${fm(og)}</b></div><div class=sum><span>Bleibt übrig</span><b class=tq>${fm(g-ob-og)}</b></div>`}
function fkh(k){const g=S.giro[0]+S.giro[1];let bz=0,ob=0,og=0;S.m[k].e.forEach(x=>{const v=+x[1]||0;if(x[3])bz+=v;else if(x[2]=='g')og+=v;else ob+=v});const op=ob+og,fc=g-bz;
return`<div class=k><div><small>Forecast (Konto − bezahlt)</small><b class="${cl(fc)}">${fm(fc)}</b></div><div><small>Noch offen</small><b>${fm(op)}</b></div><div><small>Bezahlt</small><b>${fm(bz)}</b></div><div><small>Nach allen offenen</small><b class="${cl(fc-op)}">${fm(fc-op)}</b></div></div><p class=mu style="margin:8px 0 0;font-size:13px">Offen: <span class=ok>${fm(ob)} bekannt</span> · <span class=wa>${fm(og)} geschätzt</span></p>`}
function le(k,l){return l.map((x,j)=>`<div class="ex${x[3]?' pd':''}"><div class=r style="grid-template-columns:1fr auto 34px"><input value="${es(x[0])}" onchange="ed('e',${k},${j},0,this.value)"><label class=cb><input type=checkbox ${x[3]?'checked':''} onchange="sx(${k},${j},3,this.checked?1:0)">bezahlt</label><button onclick="rm('e',${k},${j})">×</button></div><div class=r style="grid-template-columns:100px 1fr"><input class="${x[2]=='g'?'wa':'ok'}" type=number step=any inputmode=decimal value="${x[1]}" oninput="lv('e',${k},${j},this.value)" onchange="ed('e',${k},${j},1,this.value)"><select onchange="sx(${k},${j},2,this.value)"><option value=b ${x[2]=='g'?'':'selected'}>Betrag bekannt</option><option value=g ${x[2]=='g'?'selected':''}>geschätzt</option></select></div></div>`).join('')+`<button class=add onclick="ad('e',${k})">+ Eintrag</button>`}
function vM(){const k=S.cur,r=calc()[k],m=S.m[k],a=S.a[k];
return gk()+`<div class="nav2" style="margin-top:12px"><button class=pri style="margin:0" onclick="go('m',${Math.max(0,k-1)})">‹</button><select onchange="go('m',+this.value)">${S.m.map((_,i)=>`<option value=${i} ${i==k?'selected':''}>${MN[i%12]} ${Y0+Math.floor(i/12)}</option>`).join('')}</select><button class=pri style="margin:0" onclick="go('m',${Math.min(S.m.length-1,k+1)})">›</button></div>
<div class=card><h3>Forecast</h3><div class=k><div><small>Start</small><b>${fm(r.st)}</b></div><div><small>Einnahmen</small><b id=kei>${fm(r.ei)}</b></div><div><small>Ausgaben</small><b id=kau>${fm(r.au)}</b></div><div style="grid-column:1/-1"><small>Rest (Ende)</small><span class=gp><b id=kre class="${cl(r.rest)}">${fm(r.rest)}</b><small id=kgp>${gpt(k)}</small></span></div></div>
